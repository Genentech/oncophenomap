[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncophenomap"
version = "0.1.0"
description = "Genotype-phenotype maps and tree-based variance decomposition."
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.23",
    "pandas>=1.5",
    "pyarrow>=10.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "seaborn>=0.12",
]

[project.urls]
Repository = "https://github.com/Genentech/oncophenomap"

[project.optional-dependencies]
notebook = [
    "anndata>=0.9",
    "jupyter>=1.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["oncophenomap*"]
